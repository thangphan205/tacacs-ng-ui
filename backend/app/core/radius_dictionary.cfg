    # Built-in RADIUS dictionary (tacacs-ng-ui): RFC 2865, 2866, 2869, 3162
    # attributes and common vendor-specific attributes. Add more vendors under
    # TACACS NG Settings -> RADIUS -> Custom dictionary.
    radius.dictionary {
        attribute User-Name 1 string
        attribute User-Password 2 string
        attribute CHAP-Password 3 octets
        attribute NAS-IP-Address 4 ipv4addr
        attribute NAS-Port 5 integer
        attribute Service-Type 6 integer {
            Login-User 1
            Framed-User 2
            Callback-Login-User 3
            Callback-Framed-User 4
            Outbound-User 5
            Administrative-User 6
            NAS-Prompt-User 7
            Authenticate-Only 8
            Callback-NAS-Prompt 9
            Call-Check 10
            Callback-Administrative 11
            Authorize-Only 17
            Framed-Management 18
        }
        attribute Framed-Protocol 7 integer {
            PPP 1
            SLIP 2
            ARAP 3
            Gandalf-SLML 4
            Xylogics-IPX-SLIP 5
            X.75-Synchronous 6
        }
        attribute Framed-IP-Address 8 ipv4addr
        attribute Framed-IP-Netmask 9 ipv4addr
        attribute Framed-Routing 10 integer
        attribute Filter-Id 11 string
        attribute Framed-MTU 12 integer
        attribute Framed-Compression 13 integer
        attribute Login-IP-Host 14 ipv4addr
        attribute Login-Service 15 integer {
            Telnet 0
            Rlogin 1
            TCP-Clear 2
            PortMaster 3
            LAT 4
            X25-PAD 5
            X25-T3POS 6
            TCP-Clear-Quiet 8
        }
        attribute Login-TCP-Port 16 integer
        attribute Reply-Message 18 string
        attribute Callback-Number 19 string
        attribute Callback-Id 20 string
        attribute Framed-Route 22 string
        attribute State 24 octets
        attribute Class 25 string
        attribute Vendor-Specific 26 vsa
        attribute Session-Timeout 27 integer
        attribute Idle-Timeout 28 integer
        attribute Termination-Action 29 integer {
            Default 0
            RADIUS-Request 1
        }
        attribute Called-Station-Id 30 string
        attribute Calling-Station-Id 31 string
        attribute NAS-Identifier 32 string
        attribute Proxy-State 33 octets
        attribute Acct-Status-Type 40 integer {
            Start 1
            Stop 2
            Interim-Update 3
            Accounting-On 7
            Accounting-Off 8
        }
        attribute Acct-Delay-Time 41 integer
        attribute Acct-Input-Octets 42 integer
        attribute Acct-Output-Octets 43 integer
        attribute Acct-Session-Id 44 string
        attribute Acct-Authentic 45 integer {
            RADIUS 1
            Local 2
            Remote 3
        }
        attribute Acct-Session-Time 46 integer
        attribute Acct-Input-Packets 47 integer
        attribute Acct-Output-Packets 48 integer
        attribute Acct-Terminate-Cause 49 integer {
            User-Request 1
            Lost-Carrier 2
            Lost-Service 3
            Idle-Timeout 4
            Session-Timeout 5
            Admin-Reset 6
            Admin-Reboot 7
            Port-Error 8
            NAS-Error 9
            NAS-Request 10
            NAS-Reboot 11
            Port-Unneeded 12
            Port-Preempted 13
            Port-Suspended 14
            Service-Unavailable 15
            Callback 16
            User-Error 17
            Host-Request 18
        }
        attribute Acct-Multi-Session-Id 50 string
        attribute Acct-Link-Count 51 integer
        attribute Acct-Input-Gigawords 52 integer
        attribute Acct-Output-Gigawords 53 integer
        attribute Event-Timestamp 55 time
        attribute CHAP-Challenge 60 octets
        attribute NAS-Port-Type 61 integer {
            Async 0
            Sync 1
            ISDN 2
            ISDN-V120 3
            ISDN-V110 4
            Virtual 5
            PIAFS 6
            HDLC-Clear-Channel 7
            X.25 8
            X.75 9
            G.3-Fax 10
            SDSL 11
            ADSL-CAP 12
            ADSL-DMT 13
            IDSL 14
            Ethernet 15
            xDSL 16
            Cable 17
            Wireless-Other 18
            Wireless-802.11 19
        }
        attribute Port-Limit 62 integer
        attribute Tunnel-Client-Endpoint 66 string
        attribute Tunnel-Server-Endpoint 67 string
        attribute Connect-Info 77 string
        attribute EAP-Message 79 octets
        attribute Message-Authenticator 80 octets
        attribute Acct-Interim-Interval 85 integer
        attribute NAS-Port-Id 87 string
        attribute Framed-Pool 88 string
        attribute NAS-IPv6-Address 95 ipv6addr
        attribute Framed-Interface-Id 96 octets
        attribute Login-IPv6-Host 98 ipv6addr
        attribute Framed-IPv6-Route 99 string
        attribute Framed-IPv6-Pool 100 string
        attribute Framed-IPv6-Address 168 ipv6addr
    }
    radius.dictionary Cisco 9 {
        attribute Cisco-AVPair 1 string
        attribute Cisco-NAS-Port 2 string
    }
    radius.dictionary Microsoft 311 {
        attribute MS-CHAP-Response 1 octets
