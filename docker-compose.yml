services:
  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.rule=Host(`adminer.${TOOLS_DOMAIN:-${DOMAIN?Variable not set}}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.rule=Host(`adminer.${TOOLS_DOMAIN:-${DOMAIN?Variable not set}}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls.certresolver=le
      # admin-auth is the same HTTP Basic middleware the traefik dashboard uses,
      # defined on the traefik container in docker-compose.traefik.yml. Both
      # stacks share the one docker provider, so the name resolves across them.
      # Without it adminer is a public database login form: reachable by anyone,
      # brute-forceable, and exposed to whatever the floating `adminer` tag ships.
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.middlewares=admin-auth
      - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080

  prestart:
    image: "${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}"
    build:
      context: ./backend
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - USERS_OPEN_REGISTRATION=${USERS_OPEN_REGISTRATION}
      - TACACS_LOG_DIRECTORY=${TACACS_LOG_DIRECTORY}
      - TZ=${TZ:-UTC}

  backend:
    image: "${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}"
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - USERS_OPEN_REGISTRATION=${USERS_OPEN_REGISTRATION}
      - TACACS_LOG_DIRECTORY=${TACACS_LOG_DIRECTORY}
      - TZ=${TZ:-UTC}
      - MCP_ENABLED=${MCP_ENABLED:-true}

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/v1/utils/health-check/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "49:49"
    build:
      context: ./backend
    volumes:
      - ./backend/tacacs_config:/app/tacacs_config
      - tacacs_log_data:/var/log/tacacs
    # No traefik labels: the backend is not routed from the outside. The
    # frontend's nginx proxies /api, /mcp, /docs and /redoc to it, so the whole
    # application lives on one URL. Port 49 above is TACACS+ itself, which
    # never went through traefik.

  frontend:
    image: "${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}"
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: ./frontend
      args:
        # Empty: the bundle calls its own origin and nginx proxies through to
        # the backend, so the image does not depend on the deployed domain.
        - VITE_API_URL=${VITE_API_URL:-}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le

      # Rate limit, per source IP. Everything the app serves — the SPA, /api,
      # /docs and /mcp — arrives through this one router, so this is the whole
      # edge budget. Tunable via .env; see .env.example.
      #
      # sourceCriterion is deliberately left at its default (the request's
      # remote address). traefik terminates the client connection itself, so
      # that already is the real client IP; setting ipstrategy.depth would make
      # it read X-Forwarded-For instead, which a client can forge to get a
      # fresh bucket per request. Only set depth if a CDN or load balancer is
      # ever put in front of traefik, and then to the exact number of hops.
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-ratelimit.ratelimit.average=${RATE_LIMIT_AVERAGE:-100}
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-ratelimit.ratelimit.period=${RATE_LIMIT_PERIOD:-1s}
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-ratelimit.ratelimit.burst=${RATE_LIMIT_BURST:-200}

      # Enable redirection for HTTP and HTTPS
      # ratelimit comes first: https-redirect answers with a 301 and ends the
      # chain, so a middleware after it would never run.
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=${STACK_NAME?Variable not set}-ratelimit,https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.middlewares=${STACK_NAME?Variable not set}-ratelimit
volumes:
  app-db-data:
  tacacs_data_volume:
    driver: local
  tacacs_log_data: {}
networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
