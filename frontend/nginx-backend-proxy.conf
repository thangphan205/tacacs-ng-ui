# Single-URL deployment: the SPA and the API share one origin. Everything the
# backend owns is proxied through this container, so `VITE_API_URL` can stay
# empty and the browser talks to its own origin.
#
# Included from nginx.conf inside the `server` block, so the shared proxy
# settings live here at server scope and each location stays a one-liner.

# Docker's embedded DNS. Resolving through a variable (rather than a literal
# `proxy_pass http://backend:8000`) means nginx re-resolves per request instead
# of caching the address forever at startup — and it starts even when the
# backend container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend_upstream http://backend:8000;

proxy_http_version 1.1;
proxy_set_header Host $host;
# Appends our peer to whatever the outer proxy already sent, so the backend's
# get_client_ip() still reads the real client from the first element. X-Real-IP
# is deliberately not set — it would name traefik, and get_client_ip falls back
# to it.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;   # see the map in nginx.conf
# Location headers from the backend already name the public host (Host is
# passed through) and the right scheme (uvicorn runs with
# --forwarded-allow-ips), so nothing needs rewriting. Stated explicitly
# because the implicit `proxy_redirect default` is not compatible with a
# proxy_pass that uses variables.
proxy_redirect off;
client_max_body_size 20m;
proxy_read_timeout 300s;

location /api {
  proxy_pass $backend_upstream$request_uri;
}

location /docs {
  proxy_pass $backend_upstream$request_uri;
}

location /redoc {
  proxy_pass $backend_upstream$request_uri;
}

# Prefix, not /mcp/ — covers the canonical trailing-slash URL and the 307 that
# answers POST /mcp. MCP runs with json_response=True so there is no SSE
# stream, but unbuffered responses keep long tool calls honest.
#
# Kept in sync by hand with MCP_PATH (default /mcp); nginx cannot read env
# without the image's template mechanism.
location /mcp {
  proxy_pass $backend_upstream$request_uri;
  proxy_buffering off;
}
