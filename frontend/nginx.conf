# Behind traefik the hop into this container is plain http, so $scheme alone
# would report "http" for a request the client made over https — and the
# backend would answer POST /mcp with an absolute http:// redirect that
# traefik turns into a body-dropping 301. Honour the scheme the outer proxy
# reports, and fall back to our own only when nothing set it (direct access
# in development). map is http-context only, hence its place out here.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
