name: Latest Changes

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      number:
        description: PR number
        required: true
      debug_enabled:
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: "false"

jobs:
  latest-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: write
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - uses: actions/checkout@v7
        with:
          # main is unprotected, so the default GITHUB_TOKEN (with the
          # contents: write permission above) can push the commit itself —
          # no dedicated PAT secret needed.
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: tiangolo/latest-changes@0.7.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          latest_changes_file: ./docs/en/release-notes.md
          latest_changes_header: "## Unreleased"
          end_regex: "^## "
          debug_logs: true
          label_header_prefix: "### "
